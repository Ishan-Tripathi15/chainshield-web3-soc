name: Smart Contract CI

on:
  push:
  pull_request:

jobs:
  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx hardhat compile
      - run: npx hardhat test
